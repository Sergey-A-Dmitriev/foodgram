server {
    listen 80;
    server_name foodgramer.ru www.foodgramer.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foodgramer.ru www.foodgramer.ru;

    ssl_certificate /etc/letsencrypt/live/foodgramer.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgramer.ru/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/static/;
        expires 30d;
    }

    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /static;
        index index.html;
        try_files $uri /index.html;
    }
}
