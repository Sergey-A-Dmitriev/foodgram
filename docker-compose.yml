volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:14
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: sadmitriev/foodgram_backend
    depends_on:
      - db
    env_file: .env
    context: .
    dockerfile: ./backend/Dockerfile
    volumes:
      - static:/backend_static
      - media:/app/media
  frontend:
    env_file: .env
    image: sadmitriev/foodgram_frontend
    depends_on:
      - backend
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  gateway:
    image: sadmitriev/foodgram_nginx
    depends_on:
      - backend
      - frontend
    env_file: .env
    ports:
      - 80:80
      - 443:443
    volumes:
      - static:/static
      - media:/media
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
